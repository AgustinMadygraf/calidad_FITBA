<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backend API</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
</head>
<body class="bg-light">
  <main class="container py-4">
    <h1 class="mb-2">Backend API</h1>
    <p class="text-secondary mb-4">Indice autogenerado desde <code>/openapi.json</code>.</p>

    <div class="row g-3">
      <section class="col-12 col-lg-6">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h2 class="h5 card-title">Sistema</h2>
            <ul class="list-group list-group-flush">
              <li class="list-group-item"><a href="/health">GET /health</a></li>
              <li class="list-group-item"><a href="/API/health">GET /API/health</a></li>
              <li class="list-group-item"><a href="/token/inspect">GET /token/inspect</a></li>
              <li class="list-group-item"><a href="/docs">GET /docs</a></li>
              <li class="list-group-item"><a href="/openapi.json">GET /openapi.json</a></li>
            </ul>
          </div>
        </div>
      </section>

      <section class="col-12 col-lg-6">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h2 class="h5 card-title">Estado</h2>
            <p id="openapi-status" class="mb-0 text-secondary">Cargando endpoints...</p>
          </div>
        </div>
      </section>
    </div>

    <div id="openapi-sections" class="row g-3 mt-1"></div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
