[pytest]
addopts =
    --ignore=tests/test_cliente_api.py
    --ignore=tests/test_remito_api.py
    --ignore=tests/test_runtime_policy_unit.py
markers =
    unit: Unit tests (isolated logic).
    integration: Integration tests (gateway/infra boundaries).
    api_http: HTTP-level API tests (FastAPI TestClient).
    contract: Contract tests vs swagger.
